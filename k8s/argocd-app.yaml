apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris-mlops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/MLOps_platform_iris.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kserve-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
