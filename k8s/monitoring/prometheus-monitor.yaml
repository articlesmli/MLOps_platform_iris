apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iris-model-monitor
  namespace: kserve-test
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: iris-model
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
