base:
  project: "mlops-universal-platform"
  random_state: 42
  test_size: 0.2

data:
  dataset_path: "data/iris.csv"
  target_column: "target"

training:
  mlflow_experiment_name: "universal_classification_benchmark"
  use_optuna: true            # Toggle between standard benchmark and Optuna tuning
  optuna_trials: 30

models:
  - name: "random_forest"
    hyperparameters:
      n_estimators: 100
      max_depth: 8
  - name: "logistic_regression"
    hyperparameters:
      C: 1.0
      max_iter: 200
  - name: "svc"
    hyperparameters:
      C: 1.0
      kernel: "rbf"
  - name: "knn"
    hyperparameters:
      n_neighbors: 5
  - name: "decision_tree"
    hyperparameters:
      max_depth: 5