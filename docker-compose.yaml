services:
  mlflow:
    image: python:3.10-slim
    container_name: mlflow
    ports:
      - "5000:5000"
    working_dir: /app
    command: >
      bash -c "pip install mlflow==2.8.0 &&
               mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-store ./artifacts --host 0.0.0.0"
    networks:
      - ml-network

  api:
    build: .
    container_name: iris-api-container
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
    depends_on:
      - mlflow
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge