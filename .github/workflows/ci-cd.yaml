name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Dataset & Validate
      run: |
        python -c "
        import os, pandas as pd
        from sklearn.datasets import load_iris
        os.makedirs('data', exist_ok=True)
        iris = load_iris(as_frame=True)
        df = iris.frame
        df.columns = ['sepal_length', 'sepal_width', 'petal_length', 'petal_width', 'target']
        df.to_csv('data/iris.csv', index=False)
        "
        python src/validate.py

    - name: Train & Evaluate Model
      run: |
        python src/train.py
        python src/evaluate.py

    - name: Run Pytest
      env:
        PYTHONPATH: .
      run: pytest tests/test_api.py -v

    - name: Security Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'

  build-and-push:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Lowercase Repository Name
      run: |
        echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/iris-api" >> $GITHUB_ENV

    - name: Log in to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

deploy-infrastructure-and-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Lowercase Repository Name for GitOps
      run: |
        echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/iris-api" >> $GITHUB_ENV

    - name: Set up Kind Cluster
      uses: helm/kind-action@v1.9.0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      
    - name: Terraform Apply
      working-directory: ./terraform
      run: |
        terraform init -upgrade
        terraform apply -auto-approve -var="image_tag=sha-${{ github.sha }}"
        
    - name: Update GitOps Manifest
      run: |
        sed -i "s|image: ghcr.io/.*/iris-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}|g" k8s/kserve-service.yaml
        
    - name: Commit GitOps Update
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(gitops): update image tag for ArgoCD [skip ci]"
        commit_user_name: "GitHub Actions Bot"
        commit_user_email: "actions@github.com"
        file_pattern: "k8s/kserve-service.yaml"