name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/iris-api

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Load parameters from params.yaml
      run: |
        PROJECT_NAME=$(yq '.base.project' params.yaml)
        DATASET_PATH=$(yq '.data.dataset_path' params.yaml)
        MLFLOW_EXP=$(yq '.training.mlflow_experiment_name' params.yaml)
        echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
        echo "DATASET_PATH=$DATASET_PATH" >> $GITHUB_ENV
        echo "MLFLOW_EXP=$MLFLOW_EXP" >> $GITHUB_ENV

    - name: Generate Iris Dataset (Smoke Test)
      run: |
        python -c "
        import os, pandas as pd
        from sklearn.datasets import load_iris
        os.makedirs('data', exist_ok=True)
        iris = load_iris(as_frame=True)
        df = iris.frame
        df.columns = ['sepal_length', 'sepal_width', 'petal_length', 'petal_width', 'target']
        df.to_csv('${{ env.DATASET_PATH }}', index=False)
        "

    - name: Run Data Validation
      run: python src/validate.py

    - name: Train Model & Log to MLflow
      run: python src/train.py

    - name: Run Model Quality & Performance Gate
      run: python src/evaluate.py

    - name: Run Pytest Unit Tests
      env:
        PYTHONPATH: .
      run: pytest tests/test_api.py -v

    - name: Security Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'

  build-and-push:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,format=long

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy-infrastructure-and-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init & Apply
      working-directory: ./terraform
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        terraform init
        terraform apply -auto-approve -var="image_tag=sha-${GITHUB_SHA}"

    - name: Update GitOps Manifests for ArgoCD
      run: |
        IMAGE_TAG=sha-${GITHUB_SHA}
        sed -i "s|image: ghcr.io/.*/iris-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" k8s/kserve-service.yaml

    - name: Commit GitOps Manifest Update safely
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(gitops): update image tag to sha-${{ github.sha }} for ArgoCD [skip ci]"
        commit_user_name: "GitHub Actions Bot"
        commit_user_email: "actions@github.com"
        file_pattern: "k8s/kserve-service.yaml"
        create_branch: false
        skip_fetch: false
        push_options: '--force'