name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Dataset & Validate
      run: |
        python -c "
        import os, pandas as pd
        from sklearn.datasets import load_iris
        os.makedirs('data', exist_ok=True)
        iris = load_iris(as_frame=True)
        df = iris.frame
        df.columns = ['sepal_length', 'sepal_width', 'petal_length', 'petal_width', 'target']
        df.to_csv('data/iris.csv', index=False)
        "
        python src/validate.py

    - name: Train & Evaluate Model
      run: |
        python src/train.py
        python src/evaluate.py

    - name: Run Pytest
      env:
        PYTHONPATH: .
      run: pytest tests/test_api.py -v

    - name: Security Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'

  build-and-push:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Lowercase Repository Name
      run: |
        echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/iris-api" >> $GITHUB_ENV

    - name: Log in to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy-infrastructure-and-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Lowercase Repository Name for GitOps
      run: |
        echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/iris-api" >> $GITHUB_ENV

    - name: Set up Kind Cluster
      uses: helm/kind-action@v1.9.0

    - name: Install Cert-Manager and KServe (Raw Mode)
      run: |
        # 1. Install cert-manager (required for KServe webhooks)
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.3/cert-manager.yaml
        echo "Waiting for cert-manager to be ready..."
        kubectl wait --for=condition=Available --timeout=180s deployment/cert-manager -n cert-manager
        kubectl wait --for=condition=Available --timeout=180s deployment/cert-manager-cainjector -n cert-manager
        kubectl wait --for=condition=Available --timeout=180s deployment/cert-manager-webhook -n cert-manager

        # 2. Download KServe manifest and safely remove kube-rbac-proxy using PyYAML
        curl -sL https://github.com/kserve/kserve/releases/download/v0.11.0/kserve.yaml -o kserve.yaml
        pip install pyyaml
        python3 -c "
        import yaml

        with open('kserve.yaml', 'r') as f:
            docs = list(yaml.safe_load_all(f))

        new_docs = []
        for doc in docs:
            if doc and doc.get('kind') == 'Deployment' and doc.get('metadata', {}).get('name') == 'kserve-controller-manager':
                containers = doc['spec']['template']['spec']['containers']
                doc['spec']['template']['spec']['containers'] = [c for c in containers if c.get('name') != 'kube-rbac-proxy']
            if doc:
                new_docs.append(doc)

        with open('kserve.yaml', 'w') as f:
            yaml.safe_dump_all(new_docs, f)
        "
        kubectl apply -f kserve.yaml

        echo "Waiting for KServe controller deployment..."
        kubectl rollout status deployment/kserve-controller-manager -n kserve --timeout=300s

        # 3. Switch KServe to RawDeployment mode (avoids Knative/Istio dependencies)
        kubectl patch configmap/inferenceservice-config -n kserve --type=strategic -p '{"data": {"deploy": "{\"defaultDeploymentMode\": \"RawDeployment\"}"}}'

        # 4. Allow webhook server certificates and port to fully stabilize
        echo "Stabilizing KServe webhook server..."
        sleep 15

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      
    - name: Terraform Apply & Clean State
      working-directory: ./terraform
      run: |
        rm -rf .terraform .terraform.lock.hcl terraform.tfstate terraform.tfstate.backup
        terraform init
        terraform apply -auto-approve -var="image_tag=sha-${{ github.sha }}"
        
    - name: Update GitOps Manifest
      run: |
        sed -i "s|image: ghcr.io/.*/iris-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}|g" k8s/kserve-service.yaml
        
    - name: Commit GitOps Update
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(gitops): update image tag for ArgoCD [skip ci]"
        commit_user_name: "GitHub Actions Bot"
        commit_user_email: "actions@github.com"
        file_pattern: "k8s/kserve-service.yaml"